spring.application.name=security_ms
server.port=8181

# Credenciales por variables de entorno (no escribir contraseñas en este archivo).
# DB_PASSWORD es obligatoria; DB_URL y DB_USERNAME tienen valor por defecto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_ms_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Schema changes are applied by reviewed migrations, never automatically to MySQL.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Orígenes permitidos por CORS (frontend Angular). Varios separados por coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Internal JWT: mandatory Base64 key (at least 32 random bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sportmanager}
app.jwt.audience=${JWT_AUDIENCE:sportmanager-api}

# Firebase Admin remains disabled unless explicitly enabled. Supply the service-account JSON
# only through the environment; never commit it. No Firebase endpoint is exposed in this stage.
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
